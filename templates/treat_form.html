{% extends 'base.html' %}
{% block title %}{{ 'แก้ไข' if treat else 'เพิ่ม' }}การรักษา - PawCare{% endblock %}
{% block page_title %}{{ 'แก้ไขการรักษา' if treat else 'เพิ่มการรักษาใหม่' }}{% endblock %}

{% block content %}
<div class="card" style="max-width:580px">
  <div class="card-header"><h3>💊 ข้อมูลการรักษา</h3></div>
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group full">
          <label>นัดหมาย *</label>
          <select name="appt_id" required>
            <option value="">-- เลือกนัดหมาย --</option>
            {% for a in appts %}<option value="{{ a.appt_id }}" {% if treat and treat.appt_id==a.appt_id %}selected{% endif %}>{{ a.label }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group full">
          <label>รายละเอียดการรักษา *</label>
          <input name="description" value="{{ treat.description if treat else '' }}" required>
        </div>
        <div class="form-group">
          <label>ยาที่ใช้</label>
          <input name="medication" value="{{ treat.medication if treat else '' }}">
        </div>
        <div class="form-group">
          <label>ค่าใช้จ่าย (บาท) *</label>
          <input name="cost" type="number" step="0.01" min="0" value="{{ treat.cost if treat else '0' }}" required>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:22px">
        <button class="btn btn-primary" type="submit">💾 บันทึก</button>
        <a href="{{ url_for('treatments') }}" class="btn btn-secondary">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
